name: Agentic Content System CI

on:
  push:
  pull_request:

jobs:
  contracts:
    name: ${{ matrix.os }} / Node 22
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run zero-dependency contract and platform tests
        run: npm test
      - name: Validate neutral content graph and supervised handoff
        run: npm run check:graph
      - name: Check repository links and stale architecture references
        run: npm run check:repository
      - name: Check tracked whitespace
        run: git diff --check
