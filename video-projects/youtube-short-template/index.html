<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>YouTube Short Template</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --canvas: #0a0d10;
        --surface: #121821;
        --surface-2: #1a2430;
        --text: #f4f7fa;
        --muted: #8fa3b8;
        --cyan: #2ee7d2;
        --amber: #ffb020;
        --red: #ff4d5e;
        --border: rgba(244, 247, 250, 0.14);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--canvas);
        color: var(--text);
        font-family: sans-serif;
      }

      #root {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(circle at 82% 12%, rgba(46, 231, 210, 0.2), transparent 28%),
          linear-gradient(180deg, #0a0d10 0%, #0d141b 55%, #080a0d 100%);
      }

      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        background-image:
          linear-gradient(rgba(244, 247, 250, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(244, 247, 250, 0.08) 1px, transparent 1px);
        background-size: 72px 72px;
      }

      .safe-frame {
        position: absolute;
        inset: 92px 70px 116px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 48px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .pill {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 16px 22px;
        background: rgba(18, 24, 33, 0.72);
      }

      .hero {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .eyebrow {
        color: var(--cyan);
        font-size: 32px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .headline {
        max-width: 940px;
        font-size: 104px;
        line-height: 0.95;
        font-weight: 900;
        letter-spacing: 0;
      }

      .headline .accent {
        color: var(--amber);
      }

      .speaker-window {
        position: relative;
        height: 560px;
        border: 1px solid var(--border);
        background: rgba(18, 24, 33, 0.76);
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.34);
        overflow: hidden;
      }

      .speaker-window::before {
        content: "";
        position: absolute;
        inset: 18px;
        border: 1px dashed rgba(244, 247, 250, 0.18);
      }

      .face-placeholder {
        position: absolute;
        inset: 68px 70px 86px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(46, 231, 210, 0.32);
        background: linear-gradient(135deg, rgba(46, 231, 210, 0.12), rgba(255, 176, 32, 0.08));
        color: var(--muted);
        font-size: 34px;
        font-weight: 800;
        text-align: center;
      }

      .caption-card {
        min-height: 230px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 34px 40px;
        border: 1px solid var(--border);
        background: rgba(10, 13, 16, 0.88);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      }

      .caption {
        font-size: 66px;
        line-height: 1.05;
        font-weight: 900;
        text-align: center;
        letter-spacing: 0;
      }

      .caption .hot {
        color: var(--cyan);
      }

      .beat-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      .beat {
        min-height: 118px;
        padding: 20px;
        border: 1px solid var(--border);
        background: rgba(18, 24, 33, 0.74);
        font-size: 24px;
        font-weight: 800;
        color: var(--muted);
      }

      .beat strong {
        display: block;
        margin-bottom: 8px;
        color: var(--text);
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <div class="grid" data-layout-ignore></div>
      <main class="safe-frame">
        <div class="topbar">
          <div class="pill">AI Agent Build</div>
          <div class="pill">0:12</div>
        </div>

        <section class="hero">
          <div class="eyebrow">Hook</div>
          <h1 class="headline">
            Your agent is
            <span class="accent">too slow</span>
            because it watches the wrong thing.
          </h1>
        </section>

        <section class="speaker-window">
          <div class="face-placeholder">Drop A-roll here or replace with Video Use export</div>
        </section>

        <section class="caption-card">
          <div class="caption">
            Read the <span class="hot">state</span>, not the screen.
          </div>
        </section>

        <section class="beat-row">
          <div class="beat"><strong>1</strong>Problem</div>
          <div class="beat"><strong>2</strong>Workflow</div>
          <div class="beat"><strong>3</strong>Proof</div>
        </section>
      </main>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from(".topbar .pill", { y: -34, opacity: 0, duration: 0.45, stagger: 0.08, ease: "power3.out" }, 0);
      tl.from(".eyebrow", { y: 24, opacity: 0, duration: 0.35, ease: "power3.out" }, 0.25);
      tl.from(".headline", { y: 58, opacity: 0, duration: 0.72, ease: "power3.out" }, 0.42);
      tl.from(".speaker-window", { y: 70, opacity: 0, duration: 0.62, ease: "power3.out" }, 1.1);
      tl.from(".caption-card", { y: 52, opacity: 0, duration: 0.52, ease: "power3.out" }, 1.7);
      tl.from(".beat", { y: 34, opacity: 0, duration: 0.38, stagger: 0.12, ease: "power2.out" }, 2.15);
      tl.to(".caption .hot", { color: "#ffb020", duration: 0.28, ease: "power1.out" }, 3.2);
      tl.to(".caption .hot", { color: "#2ee7d2", duration: 0.28, ease: "power1.out" }, 3.55);
      tl.to(".safe-frame", { scale: 0.985, opacity: 0, duration: 0.55, ease: "power2.in" }, 11.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
